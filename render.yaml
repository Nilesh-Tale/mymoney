# Render Blueprint for the MyMoney FastAPI backend.
#
# This deploys the backend as a Docker web service on Render's free tier.
# The PostgreSQL database is hosted separately on Supabase (free) — you paste
# its connection string into the DATABASE_URL env var below (set via the
# Render dashboard, NOT committed to git).
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mymoney-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # Supabase Postgres connection string. Set this in the Render dashboard.
      # Use the SQLAlchemy + psycopg v3 URL form, e.g.:
      #   postgresql+psycopg://postgres:<password>@<host>:5432/postgres
      - key: DATABASE_URL
        sync: false
      # Comma-separated list of allowed browser origins (your GitHub Pages site).
      # Example: https://your-username.github.io
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # The single shared password required to log into the app.
      # Set this in the Render dashboard (keep it secret, not in git).
      - key: APP_PASSWORD
        sync: false
      # Secret used to sign login tokens. Render can generate a random value.
      - key: JWT_SECRET
        generateValue: true
      # How long a login stays valid, in days.
      - key: JWT_TTL_DAYS
        value: "30"
      # Login rate limiting (brute-force protection). After LOGIN_MAX_FAILURES
      # failed attempts from one IP within LOGIN_WINDOW_SECONDS, that IP is
      # locked out for LOGIN_LOCKOUT_SECONDS.
      - key: LOGIN_MAX_FAILURES
        value: "5"
      - key: LOGIN_WINDOW_SECONDS
        value: "900"
      - key: LOGIN_LOCKOUT_SECONDS
        value: "900"
